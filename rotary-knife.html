<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotary Knife</title>
<style>
:root{--bg:#1c1d1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214}}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center}
svg{width:min(100vw,calc(100vh*4/3));height:auto;display:block;font-family:Verdana,Tahoma,Geneva,sans-serif;user-select:none}
.lbl{fill:#fff;font-weight:700;font-size:15px;letter-spacing:2px;paint-order:stroke;stroke:rgba(40,90,80,.35);stroke-width:2px}
</style>
</head>
<body>
<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e3f0ec"/><stop offset=".25" stop-color="#bfddd1"/><stop offset=".6" stop-color="#8fc7b2"/><stop offset="1" stop-color="#d5e9e2"/>
  </linearGradient>
  <radialGradient id="glowbg" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#e2eaed"/><stop offset="1" stop-color="#a9b8be"/></linearGradient>
  <linearGradient id="cyl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f4"/><stop offset=".5" stop-color="#cfdadd"/><stop offset="1" stop-color="#9aaab0"/></linearGradient>
  <linearGradient id="mot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe0e3"/><stop offset=".5" stop-color="#7c858a"/><stop offset="1" stop-color="#3d4448"/></linearGradient>
  <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#dfe8ea"/><stop offset="1" stop-color="#8a999f"/></linearGradient>
</defs>
<rect width="1000" height="750" fill="url(#bg)"/>
<rect width="1000" height="750" fill="url(#glowbg)"/>
<rect x="0" y="40" width="9" height="640" fill="#f4fbf9"/>
<g id="scene"></g>
<text x="500" y="690" text-anchor="middle" font-size="20" font-weight="700" fill="#555a60" letter-spacing=".5">Rotary Knife</text>
</svg>
<script>
(function(){
  /* ---- 45° isometric-style projection: yaw 45°, pitch 30° ---- */
  var C=.7071, SP=.5, CP=.866, K=1.6, OX=500, OY=405;
  function P(x,y,z){return [OX+K*(z-x)*C, OY+K*(-y*CP+(x+z)*C*SP)];}
  function pts(a){return a.map(function(p){var q=P(p[0],p[1],p[2]);return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ");}
  function poly(a,fill,ex){return '<polygon points="'+pts(a)+'" fill="'+fill+'" '+(ex||'')+'/>';}
  function line(a,b,stroke,w,ex){var p=P(a[0],a[1],a[2]),q=P(b[0],b[1],b[2]);return '<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="'+stroke+'" stroke-width="'+w+'" '+(ex||'')+'/>';}
  /* box: top / +x face / +z face are the visible ones */
  function box(x0,x1,y0,y1,z0,z1,ct,cx,cz,ex){
    return poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],cz,ex)+
           poly([[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],cx,ex)+
           poly([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],ct,ex);
  }
  function hull(p){
    p=p.slice().sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
    function cr(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);}
    var lo=[],up=[],i;
    for(i=0;i<p.length;i++){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p[i])<=0)lo.pop();lo.push(p[i]);}
    for(i=p.length-1;i>=0;i--){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p[i])<=0)up.pop();up.push(p[i]);}
    lo.pop();up.pop();return lo.concat(up);
  }
  function ring(cx,cy,r,z,N){var a=[],i;N=N||32;for(i=0;i<N;i++){var t=6.2832*i/N;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t),z]);}return a;}
  /* cylinder with its axis along Z; near cap at z1 */
  function cylZ(cx,cy,r,z0,z1,body,cap,stroke){
    var all=ring(cx,cy,r,z0).concat(ring(cx,cy,r,z1)).map(function(q){return P(q[0],q[1],q[2])});
    var h=hull(all).map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ");
    return '<polygon points="'+h+'" fill="'+body+'" '+(stroke||'')+'/>'+poly(ring(cx,cy,r,z1),cap,stroke||'');
  }
  function seam(cx,cy,r,z0,z1,deg){
    var a=deg*Math.PI/180, vis=CP*C*Math.cos(a)+SP*Math.sin(a);
    if(vis<=0)return '';
    var x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    return line([x,y,z0],[x,y,z1],"#8e9fa6",1.6,'opacity="'+Math.min(1,vis*1.6).toFixed(2)+'"');
  }
  function spoke(cx,cy,rho,z,deg,stroke,w){
    var a=deg*Math.PI/180;
    return line([cx-rho*Math.cos(a)*.15,cy-rho*Math.sin(a)*.15,z],[cx+rho*Math.cos(a),cy+rho*Math.sin(a),z],stroke,w)+
      poly(ring(cx+rho*.82*Math.cos(a),cy+rho*.82*Math.sin(a),rho*.09,z,10),stroke);
  }
  function label(t,x,y,y3){return '<text class="lbl" x="'+x+'" y="'+y+'">'+t+'</text>';}

  /* ---- dynamic state ---- */
  var L=90, V=45, XC=130, PCX=210, marks=[69,-21,-111], flyers=[], pileN=3, MAXL=9, sensorT=0, kFlash=0, dOver=40;
  var aK=0, aU=0, aL=0, aM=0, bp=0;   // aM: góc motor, bp: pha dây đai
  var X0=-150, XS=45;            // web start (behind panel), knife contact, sensor
  var YW=60, LAYER=2.4, GROUND=-16, KY=YW+34;   // KY: tâm trục dao (bán kính 34, đáy chạm vải)
  /* 2 thanh chắn: kẹp 2 bên tấm vải (vải rộng z -35..35) */
  var PAN_X0=-170, PAN_X1=-60, PAN_Y0=-40, PAN_Y1=130;   // PAN_Y1: hạ thấp nếu muốn thấy vải rõ hơn giữa 2 thanh
  var PAN_BACK_Z=[-48,-44], PAN_FRONT_Z=[44,48];
  var SPLIT=-56;                 // vải vẽ làm 2 đoạn để chen thanh chắn trước

  function sheet(cx,y0,len,ex){
    return box(cx-len/2,cx+len/2,y0,y0+LAYER,-35,35,"#d9bd83","#b8975a","#9c7d46",ex||'stroke="#8a6c3a" stroke-width=".5"');
  }
  /* một đoạn vải từ xa đến xb (kèm vân + vạch xanh bị cắt đúng đoạn) */
  function webSeg(xa,xb){
    var s=box(xa,xb,YW-2,YW,-35,35,"#d7b97c","#b8975a","#b8975a",'stroke="#9c7d46" stroke-width=".5"');
    [-18,-4,10,24].forEach(function(z){s+=line([xa,YW+.1,z],[xb,YW+.1,z],"#a8864c",1,'opacity=".5"');});
    return s;
  }

  /* ---- Tối ưu: cảnh chia thành nhiều lớp <g> theo thứ tự vẽ.
         Lớp tĩnh (S) chỉ dựng 1 lần, lớp động (D) mới dựng lại mỗi khung hình ---- */
  var items=[];
  function S(fn){items.push({st:1,fn:fn,done:false});}
  function D(fn){items.push({st:0,fn:fn,done:false});}
  var SK='stroke="#fff" stroke-opacity=".6" stroke-width=".8"';
  function wire(a){var o='',i;for(i=0;i<a.length-1;i++)o+=line(a[i],a[i+1],'#e3e68a',1.2,'opacity=".85"');return o;}

  /* Unidrive SP + dây điện + thanh chắn sau + vải đoạn đầu + thanh chắn trước */
  S(function(){
    var s=box(-120,-84,100,215,150,186,"#fdfefe","#e8edef","#5c656c");
    s+=poly([[-83.6,170,156],[-83.6,170,180],[-83.6,150,180],[-83.6,150,156]],"#58b84a");
    s+=poly([[-83.6,196,157],[-83.6,196,179],[-83.6,208,179],[-83.6,208,157]],"#39424a");
    s+=poly([[-83.4,198,160],[-83.4,198,176],[-83.4,206,176],[-83.4,206,160]],"#c8d6d2");
    s+=poly([[-83.6,180,157],[-83.6,180,179],[-83.6,186,179],[-83.6,186,157]],"#e9eef0");
    s+=wire([[-20,32,86],[-20,32,138],[-102,32,138],[-102,32,168],[-102,100,168]]);
    s+=wire([[130,216,0],[130,226,0],[-102,226,0],[-102,226,168],[-102,215,168]]);
    s+=box(PAN_X0,PAN_X1,PAN_Y0,PAN_Y1,PAN_BACK_Z[0],PAN_BACK_Z[1],"#fff","#e8eff1","url(#pan)");
    s+=webSeg(X0,SPLIT);
    s+=box(PAN_X0,PAN_X1,PAN_Y0,PAN_Y1,PAN_FRONT_Z[0],PAN_FRONT_Z[1],"#fff","#e8eff1","url(#pan)");
    return s;
  });
  /* lower roller + encoder */
  S(function(){return cylZ(-20,32,28,-60,60,"url(#cyl2)","url(#cyl)",SK);});
  D(function(){return seam(-20,32,28,-58,58,aL);});
  S(function(){
    return poly(ring(-20,32,20,60,28),"#bccad0")+
           cylZ(-20,32,12,60,80,"#e8d800","#f4e620",'stroke="#9e9400" stroke-width="1.2"');
  });
  D(function(){return spoke(-20,32,10,80,aL,"#7d7400",2);});
  S(function(){return box(-26,-8,22,42,80,92,"#cdd6d9","#a3afb4","#8b979c")+webSeg(SPLIT-1,XC);});
  /* upper roller */
  S(function(){return cylZ(-20,88,28,-60,60,"url(#cyl)","url(#cyl2)",SK);});
  D(function(){return seam(-20,88,28,-58,58,-aL);});
  S(function(){return poly(ring(-20,88,20,60,28),"#d3dde0",'stroke="#fff" stroke-opacity=".7"')+poly(ring(-20,88,11,60,24),"#eef4f5");});
  D(function(){return spoke(-20,88,17,60,-aL,"#7b878c",2.2);});
  /* cut-mark sensor */
  S(function(){return box(40,50,70,84,-28,-8,"#7aa0ff","#2f5fd8","#2a56c9")+box(41,49,62,70,-26,-10,"#f2e21a","#d8c900","#bfb300");});
  D(function(){
    if(sensorT<=0)return '';
    var f=P(45,YW,-18), k=sensorT/.35;
    return '<circle cx="'+f[0].toFixed(1)+'" cy="'+f[1].toFixed(1)+'" r="'+(k*30).toFixed(1)+'" fill="#fff8a0" opacity="'+(k*.75).toFixed(2)+'"/>';
  });
  /* vải thò ra sau điểm cắt + tấm đã cắt + chồng vải (nằm dưới dao) */
  D(function(){
    var s='',i;
    if(dOver>.5){
      s+=box(XC,XC+dOver,YW-2,YW,-35,35,"#d7b97c","#b8975a","#b8975a",'stroke="#9c7d46" stroke-width=".5"');
      [-18,-4,10,24].forEach(function(z){s+=line([XC,YW+.1,z],[XC+dOver,YW+.1,z],"#a8864c",1,'opacity=".5"');});
    }
    for(i=0;i<pileN;i++) s+=sheet(PCX,GROUND+i*LAYER,L);
    flyers.forEach(function(fl){
      var e=Math.min(1,fl.t), cx0=XC+fl.len/2;
      s+=sheet(cx0+(PCX-cx0)*e,YW-2+(fl.ye-(YW-2))*e*e,fl.len);
    });
    return s;
  });
  /* knife roller (nằm trên vải) */
  S(function(){return cylZ(130,KY,34,-60,60,"url(#cyl)","url(#cyl2)",SK);});
  D(function(){return seam(130,KY,34,-58,58,aK);});
  S(function(){
    return cylZ(130,KY,42,60,66,"#e4ecee","#f4f9fa",'stroke="#fff" stroke-opacity=".8" stroke-width=".8"')+
           poly(ring(130,KY,32,66,32),"none",'stroke="#c3d0d4"');
  });
  D(function(){return spoke(130,KY,30,66,aK,"#8e9ba0",2.6);});
  /* puly + dây đai */
  S(function(){
    return cylZ(130,KY,22,66,74,"#d7dfe2","#eef3f4",'stroke="#fff" stroke-opacity=".6"')+
      poly([[118,200,72],[125,200,72],[110,KY,72],[104,KY,72]],"#4b4f55")+
      poly([[135,200,72],[142,200,72],[156,KY,72],[150,KY,72]],"#33373c");
  });
  D(function(){
    var s='', LS=200-KY, TS=14, off=((bp%TS)+TS)%TS, kk, d, tt, yy, op, FADE=.12;
    for(kk=-1;kk*TS<LS+TS;kk++){
      d=off+kk*TS; if(d<0||d>LS)continue;
      tt=d/LS; op=Math.min(1,tt/FADE,(1-tt)/FADE)*.8; yy=200+(KY-200)*tt;      // mờ dần ở 2 đầu để không bị "nháy"
      s+=line([135+15*tt,yy,72.2],[142+14*tt,yy,72.2],"#aab2b8",1.8,'opacity="'+op.toFixed(2)+'"');
      tt=1-tt; yy=200+(KY-200)*tt;
      s+=line([118-14*tt,yy,72.2],[125-15*tt,yy,72.2],"#aab2b8",1.8,'opacity="'+op.toFixed(2)+'"');
    }
    return s;
  });
  D(function(){return spoke(130,KY,19,74,aK,"#8e9ba0",2.2);});
  S(function(){return cylZ(130,KY,5,72,78,"#9aa5a9","#c9d2d5",'');});
  D(function(){return spoke(130,KY,4,78,aK,"#5f6a6f",1.4);});
  /* unimotor */
  S(function(){
    var s=cylZ(130,200,16,-40,45,"url(#mot)","#9aa5aa",'');
    [-30,-20,-10,0,10,20,30].forEach(function(z){s+=poly(ring(130,200,16.4,z,24),"none",'stroke="#e7ecee" stroke-opacity=".5" stroke-width="1.4"');});
    s+=cylZ(130,200,6,45,66,"#b9c3c7","#dfe7ea",'');
    s+=cylZ(130,200,10,66,74,"#d7dfe2","#eef3f4",'stroke="#fff" stroke-opacity=".6"');
    return s;
  });
  D(function(){return spoke(130,200,8,74,aM,"#8e9ba0",2);});
  /* labels */
  S(function(){
    var s='', a=P(130,200,-40); s+=label("Unimotor",a[0]-128,a[1]+10);
    a=P(-84,100,186);    s+=label("Unidrive SP",a[0]-52,a[1]+38);
    a=P(-20,32,92);      s+=label("Master Encoder",a[0]-92,a[1]+66);
    a=P(PCX,-16,0);      s+=label("Cut mark Sensor",a[0]+30,a[1]+62);
    return s;
  });

  var scene=document.getElementById("scene"), els=[], last=0, vK=120;
  items.forEach(function(){var e=document.createElementNS("http://www.w3.org/2000/svg","g");scene.appendChild(e);els.push(e);});
  function draw(){
    for(var i=0;i<items.length;i++){
      var it=items[i]; if(it.st&&it.done)continue;
      els[i].innerHTML=it.fn(); it.done=true;
    }
  }
  function frame(ts){
    if(!last)last=ts;
    var dt=Math.min(.05,(ts-last)/1000); last=ts;
    var j;
    dOver+=V*dt;
    for(j=marks.length-1;j>=0;j--){
      var lead0=marks[j]+11; marks[j]+=V*dt; var lead=marks[j]+11;
      if(lead0<XS&&lead>=XS)sensorT=.35;
      if(lead>=XC){                       // mark reaches the blade: cut right through the web
        marks.splice(j,1); kFlash=.4;
        flyers.push({t:0,len:dOver,ye:GROUND+pileN*LAYER}); dOver=0;
      }
    }
    if(Math.min.apply(null,marks)>=X0+L)marks.push(X0);
    /* trục dao quay đều */
    vK=120;                            // tốc độ đều, không tăng vọt lúc cắt
    aK+=dt*vK; aL+=dt*140;
    aM+=dt*vK*(22/10);                 // motor quay nhanh hơn trục dao theo tỉ số puly 22/10
    bp+=dt*vK*Math.PI/180*22;          // tốc độ dài của dây = ω · R puly dao
    if(sensorT>0)sensorT-=dt; if(kFlash>0)kFlash-=dt;
    for(j=flyers.length-1;j>=0;j--){
      flyers[j].t+=dt/.9;
      if(flyers[j].t>=1){flyers.splice(j,1);if(pileN>=MAXL)pileN=0;pileN++;}
    }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
