<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inline Bottle Filler</title>
<style>
:root{--bg:#1c1d1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214}}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center}
svg{width:min(100vw,calc(100vh*4/3));height:auto;display:block;font-family:Verdana,Tahoma,Geneva,sans-serif;user-select:none}
.lbl{fill:#fff;font-weight:700;font-size:15px;letter-spacing:2px;paint-order:stroke;stroke:rgba(40,90,80,.35);stroke-width:2px}
</style>
</head>
<body>
<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e3f0ec"/><stop offset=".25" stop-color="#bfddd1"/><stop offset=".6" stop-color="#8fc7b2"/><stop offset="1" stop-color="#d5e9e2"/>
  </linearGradient>
  <radialGradient id="glowbg" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#e2eaed"/><stop offset="1" stop-color="#a9b8be"/></linearGradient>
  <linearGradient id="cyl2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f4"/><stop offset=".5" stop-color="#cfdadd"/><stop offset="1" stop-color="#9aaab0"/></linearGradient>
  <linearGradient id="mot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe0e3"/><stop offset=".5" stop-color="#7c858a"/><stop offset="1" stop-color="#3d4448"/></linearGradient>
  <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#dfe8ea"/><stop offset="1" stop-color="#8a999f"/></linearGradient>
</defs>
<rect width="1000" height="750" fill="url(#bg)"/>
<rect width="1000" height="750" fill="url(#glowbg)"/>
<rect x="0" y="40" width="9" height="640" fill="#f4fbf9"/>
<g id="scene"></g>
<text x="500" y="690" text-anchor="middle" font-size="20" font-weight="700" fill="#555a60" letter-spacing=".5">Inline Bottle Filler</text>
</svg>
<script>
(function(){
  /* ---- 45° isometric-style projection: yaw 45°, pitch 30° ---- */
  var C=.7071, SP=.5, CP=.866, K=1.6, OX=415, OY=465;
  function P(x,y,z){return [OX+K*(x-z)*C, OY+K*(-y*CP+(x+z)*C*SP)];}
  function pts(a){return a.map(function(p){var q=P(p[0],p[1],p[2]);return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ");}
  function poly(a,fill,ex){return '<polygon points="'+pts(a)+'" fill="'+fill+'" '+(ex||'')+'/>';}
  function line(a,b,stroke,w,ex){var p=P(a[0],a[1],a[2]),q=P(b[0],b[1],b[2]);return '<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="'+stroke+'" stroke-width="'+w+'" '+(ex||'')+'/>';}
  /* box: top / +x face / +z face are the visible ones */
  function box(x0,x1,y0,y1,z0,z1,ct,cx,cz,ex){
    return poly([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],cz,ex)+
           poly([[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],cx,ex)+
           poly([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],ct,ex);
  }
  function hull(p){
    p=p.slice().sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
    function cr(o,a,b){return (a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);}
    var lo=[],up=[],i;
    for(i=0;i<p.length;i++){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p[i])<=0)lo.pop();lo.push(p[i]);}
    for(i=p.length-1;i>=0;i--){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p[i])<=0)up.pop();up.push(p[i]);}
    lo.pop();up.pop();return lo.concat(up);
  }
  function ring(cx,cy,r,z,N){var a=[],i;N=N||32;for(i=0;i<N;i++){var t=6.2832*i/N;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t),z]);}return a;}
  /* cylinder with its axis along Z; near cap at z1 */
  function cylZ(cx,cy,r,z0,z1,body,cap,stroke){
    var all=ring(cx,cy,r,z0).concat(ring(cx,cy,r,z1)).map(function(q){return P(q[0],q[1],q[2])});
    var h=hull(all).map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ");
    return '<polygon points="'+h+'" fill="'+body+'" '+(stroke||'')+'/>'+poly(ring(cx,cy,r,z1),cap,stroke||'');
  }
  function seam(cx,cy,r,z0,z1,deg){
    var a=deg*Math.PI/180, vis=CP*C*Math.cos(a)+SP*Math.sin(a);
    if(vis<=0)return '';
    var x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    return line([x,y,z0],[x,y,z1],"#8e9fa6",1.6,'opacity="'+Math.min(1,vis*1.6).toFixed(2)+'"');
  }
  function spoke(cx,cy,rho,z,deg,stroke,w){
    var a=deg*Math.PI/180;
    return line([cx-rho*Math.cos(a)*.15,cy-rho*Math.sin(a)*.15,z],[cx+rho*Math.cos(a),cy+rho*Math.sin(a),z],stroke,w)+
      poly(ring(cx+rho*.82*Math.cos(a),cy+rho*.82*Math.sin(a),rho*.09,z,10),stroke);
  }
  function label(t,x,y,y3){return '<text class="lbl" x="'+x+'" y="'+y+'">'+t+'</text>';}


  /* ---- hình trụ theo trục bất kỳ (x / y / z); mặt gần ở a1 ---- */
  function ringA(ax,u,v,r,a,N){var o=[],i,t,c,s;N=N||24;for(i=0;i<N;i++){t=6.2832*i/N;c=r*Math.cos(t);s=r*Math.sin(t);o.push(ax=='x'?[a,u+c,v+s]:ax=='y'?[u+c,a,v+s]:[u+c,v+s,a]);}return o;}
  function cylA(ax,u,v,r,a0,a1,body,cap,ex){
    var all=ringA(ax,u,v,r,a0).concat(ringA(ax,u,v,r,a1)).map(function(q){return P(q[0],q[1],q[2])});
    var h=hull(all).map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ");
    return '<polygon points="'+h+'" fill="'+body+'" '+(ex||'')+'/>'+poly(ringA(ax,u,v,r,a1),cap,ex||'');
  }
  function spokeX(y,z,rho,x,deg,stroke,w){var a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return line([x,y-rho*c*.15,z-rho*s*.15],[x,y+rho*c,z+rho*s],stroke,w);}
  function wire(a){var o='',i;for(i=0;i<a.length-1;i++)o+=line(a[i],a[i+1],'#e3e68a',1.3,'opacity=".9"');return o;}

  /* ---- thông số ---- */
  var V=45, PT=40;                       // tốc độ băng tải, bước chai
  var BX0=-150, BX1=195, BY=10;          // băng tải: đầu, cuối, mặt trên
  var CX0=55, Tc=3*PT/V, Tf=1.8, Tr=Tc-Tf, CX1=CX0+V*Tf;   // đầu rót bám theo 3 chai trong Tf giây rồi quay về trong Tr giây
  var ph=0, cx=CX0, bx=0, aE=0, aM=0, sensorT=0, bottles=[], x;
  for(x=-145;x<=190;x+=PT)bottles.push({x:x,fill:x>100?1:0});

  function carriageX(t){
    if(t<Tf)return CX0+V*t;
    var u=(t-Tf)/Tr,u2=u*u,u3=u2*u;     // quay về bằng đường cong Hermite, vận tốc liên tục với đoạn bám theo
    return (2*u3-3*u2+1)*CX1+(u3-2*u2+u)*Tr*V+(-2*u3+3*u2)*CX0+(u3-u2)*Tr*V;
  }
  function bottle(b){
    var s='', lv=b.fill*22;
    if(lv>.4)s+=cylA('y',b.x,0,8,BY+.5,BY+.5+lv,"#b5271f","#d8473d");
    s+=cylA('y',b.x,0,9,BY,BY+24,"#ff6a5a","#ff9488",'opacity=".5" stroke="#fff" stroke-opacity=".5" stroke-width=".6"');
    s+=cylA('y',b.x,0,4.2,BY+24,BY+34,"#ff6a5a","#ff9488",'opacity=".7"');
    return s;
  }

  var items=[];
  function S(fn){items.push({st:1,fn:fn,done:false});}
  function D(fn){items.push({st:0,fn:fn,done:false});}

  /* dây điện (nền sau) + Unidrive SP */
  S(function(){
    var s=wire([[38,130,-72],[38,130,-100],[38,80,-100],[-125,80,-100],[-125,-30,-100],[-125,-30,40],[-125,-4,40]]);
    s+=wire([[38,80,-100],[225,80,-100],[225,80,0],[225,84,0]]);
    s+=box(20,56,130,245,-90,-54,"#fdfefe","#e8edef","#5c656c");
    s+=poly([[56.4,200,-84],[56.4,200,-60],[56.4,180,-60],[56.4,180,-84]],"#58b84a");
    s+=poly([[56.4,238,-83],[56.4,238,-61],[56.4,226,-61],[56.4,226,-83]],"#39424a");
    s+=poly([[56.6,236,-80],[56.6,236,-64],[56.6,228,-64],[56.6,228,-80]],"#c8d6d2");
    s+=poly([[56.4,216,-84],[56.4,216,-60],[56.4,210,-60],[56.4,210,-84]],"#e9eef0");
    /* băng tải */
    s+=box(BX0,BX1,-14,6,-34,34,"#5a5f66","#3b4046","#33383d");
    s+=box(BX0,BX1,6,BY,-30,30,"#2d3136","#25292d","#25292d");
    return s;
  });
  D(function(){
    var s='', x0=BX0+((bx%20)+20)%20;
    for(var xx=x0;xx<BX1;xx+=20)s+=line([xx,BY+.15,-30],[xx,BY+.15,30],"#98a0a8",1,'opacity=".28"');
    return s;
  });
  /* chai */
  D(function(){return bottles.map(bottle).join('');});
  /* trục vít: ổ trái, thân, ren chạy */
  S(function(){return box(-52,-40,88,112,-11,11,"#cdd6d9","#a3afb4","#8b979c")+cylA('x',100,0,5,-46,176,"url(#cyl)","url(#cyl2)",'stroke="#fff" stroke-opacity=".6" stroke-width=".6"');});
  D(function(){
    var s='', off=(((cx*.2)%6)+6)%6;
    for(var xx=-38+off;xx<168;xx+=6)s+=poly(ringA('x',100,0,5.6,xx,12),"none",'stroke="#8c9aa0" stroke-width="1.2" stroke-opacity=".8"');
    return s;
  });
  /* cụm đầu rót: con trượt, thanh treo, thanh ngang, 3 vòi, tia rót */
  D(function(){
    var s=box(cx-14,cx+14,90,112,-12,12,"#eef3f4","#cfd9dc","#aab6ba");
    s+=box(cx-3,cx+3,76,90,-3,3,"#cdd6d9","#a3afb4","#8b979c");
    s+=box(cx-50,cx+50,62,76,-8,8,"#f4f8f9","#d4dde0","url(#pan)");
    for(var j=0;j<3;j++){
      var nx=cx+(j-1)*PT;
      s+=box(nx-2.5,nx+2.5,52,62,-2.5,2.5,"#b4bfc4","#8d999e","#7c888d");
      if(ph<Tf){
        bottles.forEach(function(b){
          if(Math.abs(b.x-nx)<5){
            var yb=BY+.5+b.fill*22; if(yb<44)yb=BY+34;
            s+=box(nx-1.4,nx+1.4,yb,52,-1.4,1.4,"#cdf7d7","#9fe5b4","#9fe5b4",'opacity=".85"');
          }
        });
      }
    }
    return s;
  });
  /* ổ phải + khớp nối + Unimotor */
  S(function(){
    var s=box(170,182,88,112,-11,11,"#cdd6d9","#a3afb4","#8b979c");
    s+=cylA('x',100,0,6.5,182,200,"#b9c3c7","#dfe7ea");
    s+=cylA('x',100,0,16,200,250,"url(#mot)","#9aa5aa");
    [206,214,222,230,238].forEach(function(xx){s+=poly(ringA('x',100,0,16.4,xx,24),"none",'stroke="#e7ecee" stroke-opacity=".5" stroke-width="1.4"');});
    return s;
  });
  D(function(){return spokeX(100,0,12,250.2,aM,"#8e9ba0",2.4);});
  /* cảm biến */
  S(function(){
    return box(131,137,-14,16,40,44,"#8c979c","#6d787d","#5c666b")+
           box(128,140,16,30,36,48,"#7aa0ff","#2f5fd8","#2a56c9")+
           box(129,139,22,26,32,36,"#f2e21a","#d8c900","#bfb300");
  });
  D(function(){
    if(sensorT<=0)return '';
    var f=P(135,24,32), k=sensorT/.35;
    return '<circle cx="'+f[0].toFixed(1)+'" cy="'+f[1].toFixed(1)+'" r="'+(k*26).toFixed(1)+'" fill="#fff8a0" opacity="'+(k*.75).toFixed(2)+'"/>';
  });
  /* encoder */
  S(function(){
    return box(-130,-120,-10,0,30,38,"#cdd6d9","#a3afb4","#8b979c")+
           cylZ(-125,-4,12,38,48,"#e8d800","#f4e620",'stroke="#9e9400" stroke-width="1.2"');
  });
  D(function(){return spoke(-125,-4,10,48,aE,"#7d7400",2);});
  /* nhãn */
  S(function(){
    var s='', a=P(56,205,-90); s+=label("Unidrive SP",a[0]+14,a[1]+8);
    a=P(225,120,0);   s+=label("Unimotor",a[0]-20,a[1]-30);
    a=P(-125,-14,48); s+=label("Encoder",a[0]-6,a[1]+62);
    a=P(135,-14,44);  s+=label("Sensor",a[0]-24,a[1]+44);
    return s;
  });

  var scene=document.getElementById("scene"), els=[], last=0;
  items.forEach(function(){var e=document.createElementNS("http://www.w3.org/2000/svg","g");scene.appendChild(e);els.push(e);});
  function draw(){
    for(var i=0;i<items.length;i++){
      var it=items[i]; if(it.st&&it.done)continue;
      els[i].innerHTML=it.fn(); it.done=true;
    }
  }
  function step(dt){
    var j,k,prevCx=cx;
    ph+=dt; if(ph>=Tc)ph-=Tc;
    cx=carriageX(ph);
    bx+=V*dt; aE+=V*dt/12*57.3;
    aM+=(cx-prevCx)*12;                       // trục vít quay theo quãng đường con trượt
    for(j=0;j<bottles.length;j++){
      var b=bottles[j], px=b.x; b.x+=V*dt;
      if(px<135&&b.x>=135)sensorT=.35;
      for(k=0;k<3;k++){
        var nx=cx+(k-1)*PT;
        if(ph<Tf&&Math.abs(b.x-nx)<5)b.fill=Math.min(1,ph/Tf);
        else if(ph>=Tf&&b.fill>0&&b.fill<1)b.fill=1;
      }
    }
    while(bottles.length&&bottles[bottles.length-1].x>190)bottles.pop();
    if(bottles[0].x-PT>=-145)bottles.unshift({x:bottles[0].x-PT,fill:0});
    if(sensorT>0)sensorT-=dt;
  }
  function frame(ts){
    if(!last)last=ts;
    var dt=Math.min(.05,(ts-last)/1000); last=ts;
    step(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
